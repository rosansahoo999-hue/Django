{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<section class="feature-area section-gap" id="service">
    <div class="container">
        <div class="menu-content pb-60 col=lg-8">
            <div class="title text-center">
                <h1 class="mb-10">Calculator</h1>

            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <form method='post'>
                    {% csrf_token %}
                    <label>Value 1</label>
                    <input type="text" name="num1" class="form-control" />
                    <label>Select OPR....</label>
                    <select name="opr" class="form-control">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select>
                    <label>Value 2</label>
                    <input type="text" name="num2" class="form-control" />

                    <button type="submit">Calculator</button>
                    <br>
                    <label>Output</label>
                    <input type="text" class="form-control" value={{c}} readonly/>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
