{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<section class="feature-area section-gap" id="service">
    <div class="container">
        <div class="menu-content pb-60 col=lg-8">
            <div class="title text-center">
                <h1 class="mb-10">MarkSheet</h1>

            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <form method='post'>
                    {% csrf_token %}
                    <label>Subject1</label>
                    <input type="text" name="subject1" class="form-control" />
                    <label>Subject2</label>
                    <input type="text" name="subject2" class="form-control" />
                    <label>Subject3</label>
                    <input type="text" name="subject3" class="form-control" />
                    <label>Subject4</label>
                    <input type="text" name="subject4" class="form-control" />
                    <label>Subject5</label>
                    <input type="text" name="subject5" class="form-control" />
                    
                    <button type="submit">Marksheet</button>
                    <br>
                    <label>Total</label>
                    <input type="text" class="form-control" value={{total}} readonly />
                    <label>Percentage</label>
                    <input type="text" class="form-control" value="{{per}}" readonly />
                    <label>Division</label>
                    <input type="text" class="form-control" value="{{div}}" readonly />
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
