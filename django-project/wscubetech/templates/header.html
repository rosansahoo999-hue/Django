<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/header.css">
</head>
<body>
    <header>
    <ul class="navbar">
    <!-- {{request.path}} -->
    <li class="{% if request.path == '/' %} active {% endif %}"><a href="{% url 'home' %}">Home</a></li>

    <li class="{% if request.path == '/about-us/' %} active {% endif %}"><a href="{% url 'about' %}">About</a></li>

    <li><a href="/user-post">POST</a></li>
    <li><a href="/calculator">calculator</a></li>
    <li><a href="/even-odd">even_odd</a></li>
    <li><a href="/mark-sheet">markSheet</a></li>

    {% url 'contact' as urls %}

    </ul>
    </header>
</body>
</html>
